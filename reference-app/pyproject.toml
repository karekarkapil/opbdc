# Tool settings only; dependencies live in requirements*.txt.
[project]
name = "copper-pot-reorder"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, simplify, pyupgrade
select = ["E", "F", "I", "B", "SIM", "UP"]
