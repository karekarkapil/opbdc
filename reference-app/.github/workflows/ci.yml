# Continuous integration for reference-app. Last checked: 2026-09-26.
#
# GitHub only runs workflows from .github/workflows/ at the ROOT of a repository.
# In the companion repository this file lives inside reference-app/, so it does
# not run from here. To use it, copy it to <repo root>/.github/workflows/ci.yml.
# It is already written for that place: every step runs in reference-app/.
# If you use reference-app/ as the root of your own repository, delete the
# `paths` filters and the `working-directory` line.
#
# The checks, in the order Chapter 7 lists them: secret scan, lint, tests,
# known vulnerabilities in dependencies. If any fails, the change stops here.

name: reference-app CI

on:
  push:
    branches: [main]
    paths: ["reference-app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["reference-app/**", ".github/workflows/ci.yml"]

# Read-only by default: CI needs to read the code, never to change it.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: reference-app

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From the release's checksums file, gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Actions are pinned to a full commit, not a tag, because a tag can be moved.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference-app/requirements*.txt

      # First, before anything is installed: is there a password or key in the code?
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact

      - name: Install dependencies (pinned)
        run: pip install -r requirements-dev.txt

      - name: Lint and format check (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests, including every acceptance test in the spec
        run: pytest -W error

      - name: Known vulnerabilities in runtime dependencies (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
